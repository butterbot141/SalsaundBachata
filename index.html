<!DOCTYPE html>
<!--
  Tanzschritte – PWA (GitHub Pages). Begleitdateien: manifest.webmanifest, sw.js, icon-192.png, icon-512.png
  Datenblöcke:
    #data   -> alle Schritte (JSON). "integratedDrafts" = IDs bereits eingearbeiteter Drafts.
               Felder pro Schritt: id, dance, level, name, counts, position ("start → ende"), table[{count,h,d}],
               ablauf[] (extra knapp; bei Kombis die Kombination), notizen (nur auf Aufforderung), alternativ,
               video, status (platzhalter | pruefen | fertig), wuerfel (false = nicht würfeln)
    #notes  -> exportierte eigene Notizen {id: text}; nach dem Einarbeiten leeren.
  Begriffe: L = Leader, F = Follower, li/re = linker/rechter Fuß, RH/LH = rechte/linke Hand.
    #drafts -> in der App erstellte Drafts (JSON-Array), werden beim Export hier eingebettet.
  Gerätespeicher (pro Gerät, nicht in dieser Datei): Videos (IndexedDB), Favoriten, eigene Notizen, Drafts, Einstellungen.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17121D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Tanzschritte</title>
<style>
:root{
  --bg:#17121D; --surface:#221A29; --surface2:#2D2335; --line:#3B3044;
  --text:#F4EEE8; --muted:#A99EB2; --faint:#6E6377;
  --salsa:#F2A93B; --bachata:#E57AA3; --accent:var(--salsa);
  --A1:#8BD3B0; --A2:#7DB8E8; --A3:#B39CF0; --M1:#F0C36A; --M2:#F0A06A; --M3:#EE7A7A;
  --font:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:640px;margin:0 auto;padding:0 18px 96px}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[data-dance="bachata"]{--accent:var(--bachata)}
[data-dance="salsa"]{--accent:var(--salsa)}

/* Kopfzeile */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  min-height:60px;margin:0 -18px 8px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.back{display:grid;place-items:center;width:48px;height:48px;border:0;background:none;border-radius:50%;cursor:pointer}
.back:active{background:var(--surface2)}
.back svg{width:26px;height:26px}
.crumb{color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .spacer{flex:1}
.iconbtn{display:grid;place-items:center;min-width:48px;height:48px;padding:0 12px;border:0;border-radius:24px;background:var(--surface);font-size:15px;cursor:pointer}
.star{font-size:24px;color:var(--faint);background:none}
.star[aria-pressed="true"]{color:var(--accent)}

/* Start */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:22px 0 14px}
.home-head h1{margin:0;font-size:22px;font-weight:600;color:var(--muted)}
.search{display:block;width:100%;min-height:52px;margin-bottom:14px;padding:12px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);font-size:17px}
.search::placeholder{color:var(--faint)}
.dance-tile{display:block;position:relative;overflow:hidden;margin-bottom:12px;padding:22px 20px 18px;
  min-height:180px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.dance-tile:active{background:var(--surface2)}
.dance-tile .word{display:block;font-size:clamp(52px,16vw,76px);font-weight:800;letter-spacing:-.03em;line-height:.95;color:var(--accent)}
.dance-tile .meta{display:block;margin-top:10px;font-size:17px;color:var(--muted)}
.dance-tile .beats{position:absolute;left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;
  font-size:15px;font-variant-numeric:tabular-nums;color:var(--faint)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.quick a{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;padding:14px 16px;
  border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.quick a:active{background:var(--surface2)}
.quick b{font-size:20px;font-weight:700}
.quick span{color:var(--muted);font-size:14px}
.row-link{display:flex;align-items:center;justify-content:space-between;min-height:56px;margin-top:8px;padding:0 18px;
  border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:17px}
.count-pill{min-width:28px;padding:2px 9px;border-radius:12px;background:var(--surface2);color:var(--text);text-align:center;font-size:15px}

/* Ebenen */
.page-title{margin:14px 0 18px;font-size:44px;font-weight:800;letter-spacing:-.025em;color:var(--accent)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.level-tile{display:flex;flex-direction:column;justify-content:space-between;min-height:110px;padding:16px;
  border-radius:18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--lv)}
.level-tile:active{background:var(--surface2)}
.level-tile b{font-size:34px;font-weight:800;color:var(--lv)}
.level-tile span{color:var(--muted);font-size:15px}
.level-tile.empty{opacity:.5}
.lv-A1{--lv:var(--A1)} .lv-A2{--lv:var(--A2)} .lv-A3{--lv:var(--A3)} .lv-M1{--lv:var(--M1)} .lv-M2{--lv:var(--M2)} .lv-M3{--lv:var(--M3)}

/* Liste */
.list{list-style:none;margin:0;padding:0}
.list a{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list a:active{background:var(--surface)}
.list .nr{width:38px;flex:none;color:var(--faint);font-variant-numeric:tabular-nums;font-size:15px}
.list .nm{flex:1;font-size:19px;font-weight:600}
.list .nm small{display:block;font-size:13px;font-weight:400;color:var(--faint)}
.list .st{font-size:13px;color:var(--muted)}
.list .st.draft{color:var(--accent)}
.list .fav{color:var(--accent);font-size:16px}
ol.list{counter-reset:r}
ol.list a::before{counter-increment:r;content:counter(r);flex:none;display:grid;place-items:center;width:32px;height:32px;
  border-radius:50%;background:var(--accent);color:#1A1420;font-weight:800}
.empty-state{padding:28px 4px;color:var(--muted);font-size:17px;line-height:1.5}

/* Detail */
.num{margin:10px 0 0;color:var(--faint);font-size:15px;font-variant-numeric:tabular-nums}
.title{margin:2px 0 12px;font-size:clamp(38px,11vw,54px);font-weight:800;letter-spacing:-.025em;line-height:1.02}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip,.badge{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;font-size:15px;background:var(--surface2);color:var(--text)}
.badge{background:var(--lv);color:#1A1420;font-weight:700}
.chip.open{color:var(--faint)}

.ruler{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.ruler .row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.beat{display:grid;place-items:center;height:38px;border-radius:8px;background:var(--surface);
  font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.beat.rest{background:transparent;border:1px dashed var(--line);color:var(--faint);font-weight:500;font-size:13px}
.ruler.unknown .beat{opacity:.45}
.beat.on{background:var(--accent);color:#1A1420;border-color:var(--accent)}

.video-wrap{margin-bottom:22px}
video{display:block;width:100%;aspect-ratio:9/16;max-height:62vh;background:#000;border-radius:16px;object-fit:contain}
.vmissing{padding:18px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);color:var(--muted);line-height:1.5}
.vmissing code{color:var(--text);word-break:break-all}
.vmissing .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1A1420;font-weight:700}
.linkbtn{display:block;margin:8px auto 0;min-height:44px;padding:0 14px;border:0;background:none;color:var(--muted);font-size:15px;text-decoration:underline;cursor:pointer}

section h2{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
section{margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:14px;padding:0 8px 8px}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:top;line-height:1.35}
td:first-child{white-space:nowrap;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;width:1%}
.dash{color:var(--faint)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:17px;line-height:1.4;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s);flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  background:var(--surface2);color:var(--accent);font-weight:700;font-size:14px}
.note{padding:14px 16px;border-radius:14px;background:var(--surface);border-left:4px solid var(--accent)}
.note p{margin:0 0 10px;font-size:17px;line-height:1.45}
.note .alt{color:var(--muted);font-size:16px}
.note .alt b{color:var(--text);font-weight:600}
.mynote{display:block;width:100%;min-height:88px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);
  background:var(--bg);font-size:16px;line-height:1.45;resize:vertical}
.mynote::placeholder{color:var(--faint)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pager a{display:flex;flex-direction:column;justify-content:center;min-height:62px;padding:8px 14px;border-radius:14px;background:var(--surface);font-size:15px}
.pager a small{color:var(--faint);font-size:13px}
.pager a.next{text-align:right}
.pager span{min-height:62px}

/* Buttons & Formulare */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:0 18px;border-radius:16px;
  border:1px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;text-align:center}
.btn:active{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1A1420}
.btn.danger{color:#F08A6A}
.stack{display:flex;flex-direction:column;gap:10px;margin:16px 0}
label{display:block;margin-bottom:16px;font-size:15px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:6px;min-height:52px;padding:12px 14px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:17px;color:var(--text)}
textarea{min-height:200px;line-height:1.45;resize:vertical}
.hint{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 16px}
.card{display:block;padding:14px 16px;margin-bottom:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.card b{display:block;font-size:17px;margin-bottom:4px}
.card small{color:var(--faint)}
.card p{margin:6px 0 0;color:var(--muted);font-size:15px;white-space:pre-line;max-height:4.5em;overflow:hidden}
dl.gloss{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:17px}
dl.gloss dt{font-weight:700;color:var(--accent)}
dl.gloss dd{margin:0;color:var(--text)}
.field{margin-bottom:18px}
.field > span{display:block;margin-bottom:8px;font-size:15px;color:var(--muted)}
.togglechips{display:flex;flex-wrap:wrap;gap:8px}
.togglechips button{min-width:56px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.togglechips button[aria-pressed="true"]{background:var(--surface2);border-color:var(--accent);color:var(--accent);font-weight:700}
.togglechips button:disabled{opacity:.35}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;cursor:pointer}
.stepper output{min-width:48px;text-align:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}

/* Übungstakt */
.tempo{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 4px}
.tempo b{font-size:64px;font-weight:800;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.tempo span{color:var(--muted);font-size:17px}
input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.bigplay{width:100%;min-height:72px;margin:8px 0 18px;border:0;border-radius:20px;background:var(--accent);color:#1A1420;font-size:22px;font-weight:800;cursor:pointer}
.bigplay[aria-pressed="true"]{background:var(--surface2);color:var(--accent);border:2px solid var(--accent)}
#pill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15}
#pill .pill{display:flex;align-items:center;gap:12px;padding:6px 6px 6px 18px;border-radius:28px;background:var(--surface2);
  border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:15px;white-space:nowrap}
#pill .pill b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.2em;display:inline-block;text-align:center}
#pill button{min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--accent);color:#1A1420;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  max-width:90vw;padding:14px 20px;border-radius:14px;background:var(--text);color:var(--bg);font-size:16px;z-index:20}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
</style>
</head>

    {"id":"027","dance":"salsa","level":"A3","name":"Caress mit Handwechsel","counts":null,"position":"","table":[],"ablauf":[],"video":"videos/027_caress_mit_handwechsel.mp4","status":"platzhalter","notizen":"","alternativ":""},
    {"id":"028","dance":"salsa","level":"A3","name":"Titanic mit Bogen","counts":null,"position":"","table":[],"ablauf":[],"video":"videos/028_titanic_mit_bogen.mp4","status":"platzhalter","notizen":"","alternativ":""},

<script id="drafts" type="application/json">[]</script>

<script id="notes" type="application/json">{}</script>

<script>
(function () {
  'use strict';

  // Quelltext der Seite vor dem ersten Rendern sichern (für den Export mit Drafts)
  var SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  var DATA = JSON.parse(document.getElementById('data').textContent);
  var LEVELS = ['A1', 'A2', 'A3', 'M1', 'M2', 'M3'];
  var KEY = { drafts: 'tanzschritte.drafts', favs: 'tanzschritte.favs', notes: 'tanzschritte.notes',
              dice: 'tanzschritte.dice', beat: 'tanzschritte.beat' };
  var app = document.getElementById('app');
  var pillEl = document.getElementById('pill');
  var urlCache = new Map(), importedIds = new Set();
  var installEvt = null, storageOk = true, stack = [];
  var rate = 1, loopOn = true, searchQ = '';

  var GLOSSAR = [
    ['RT', 'Right Turn (Rechtsdrehung)'], ['LT', 'Left Turn (Linksdrehung)'], ['2RT', 'Double Right Turn (doppelte RT)'],
    ['FLT', 'Follower Left Turn (LT des F)'], ['LLT', 'Leader Left Turn (LT des L)'],
    ['HL', 'Hammerlock'], ['CBL', 'Cross Body Lead'], ['L / F', 'Leader / Follower'],
    ['↻ / ↺', 'Rechts- / Linksdrehung'], ['RH / LH', 'rechte / linke Hand'], ['li / re', 'linker / rechter Fuß']
  ];

  // ---------- Gerätespeicher ----------
  function readJSON(text, fallback) { try { var v = JSON.parse(text); return v == null ? fallback : v; } catch (e) { return fallback; } }
  function lsGet(k, fb) { try { return readJSON(localStorage.getItem(k), fb); } catch (e) { storageOk = false; return fb; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); storageOk = true; } catch (e) { storageOk = false; } }

  var favs = new Set(lsGet(KEY.favs, []));
  var notes = lsGet(KEY.notes, {});
  // Eigene Notizen, die Claude in die Standardversion übernommen hat, lokal entfernen
  (function () {
    var changed = false;
    Object.keys(notes).forEach(function (id) {
      var s = DATA.steps.find(function (x) { return x.id === id; });
      var mine = String(notes[id] || '').trim();
      if (!mine || (s && s.notizen && s.notizen.indexOf(mine) >= 0)) { delete notes[id]; changed = true; }
    });
    if (changed) lsSet(KEY.notes, notes);
  })();
  var dice = Object.assign({ dance: 'salsa', n: 3, levels: [], favOnly: false, last: [] }, lsGet(KEY.dice, {}));
  var beatCfg = Object.assign({ style: 'salsa', bpm: { salsa: 150, bachata: 120 }, count: true }, lsGet(KEY.beat, {}));

  // ---------- Drafts ----------
  function loadDrafts() {
    var embedded = readJSON(document.getElementById('drafts').textContent || '[]', []);
    var local = lsGet(KEY.drafts, []);
    var done = new Set(DATA.integratedDrafts || []);
    var map = new Map();
    embedded.concat(local).forEach(function (d) { if (d && d.id && !done.has(d.id)) map.set(d.id, d); });
    return Array.from(map.values()).sort(function (a, b) { return a.created < b.created ? -1 : 1; });
  }
  var drafts = loadDrafts();
  function saveDrafts() { lsSet(KEY.drafts, drafts); }
  saveDrafts();
  function draftsFor(id) { return drafts.filter(function (d) { return d.step === id; }); }

  // ---------- Videospeicher (IndexedDB) ----------
  var dbP = null;
  function db() {
    if (!dbP) dbP = new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error('kein IndexedDB'));
      var r = indexedDB.open('tanzschritte', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('videos'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbP;
  }
  function idb(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('videos', mode), out;
        var req = fn(tx.objectStore('videos'));
        if (req) req.onsuccess = function () { out = req.result; };
        tx.oncomplete = function () { res(out); };
        tx.onerror = tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function videoPut(id, file) {
    return idb('readwrite', function (st) {
      return st.put({ name: file.name, size: file.size, blob: new Blob([file], { type: file.type || 'video/mp4' }) }, id);
    });
  }
  function videoGet(id) { return idb('readonly', function (st) { return st.get(id); }); }
  function videoClear() { return idb('readwrite', function (st) { return st.clear(); }); }
  function refreshKeys() {
    return idb('readonly', function (st) { return st.getAllKeys(); })
      .then(function (k) { importedIds = new Set(k || []); }, function () {});
  }
  function forgetUrl(id) { var u = urlCache.get(id); if (u) URL.revokeObjectURL(u); urlCache.delete(id); }
  function importFiles(files, forId) {
    var jobs = [];
    files.forEach(function (f) {
      var id = forId || (f.name.match(/^(\d{3})/) || [])[1];
      if (!id || !stepById(id)) return;
      jobs.push(videoPut(id, f).then(function () { forgetUrl(id); importedIds.add(id); }));
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    return Promise.all(jobs).then(function () { return jobs.length; });
  }

  // ---------- Hilfen ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stepById(id) { return DATA.steps.find(function (s) { return s.id === id; }); }
  function stepsOf(dance, level) {
    return DATA.steps.filter(function (s) { return s.dance === dance && (!level || s.level === level); });
  }
  function danceName(d) { return (DATA.dances[d] || {}).name || d; }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }
  var BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  function bar(parent, crumb, extra) {
    return '<header class="bar">' +
      (parent ? '<button class="back" data-action="back" data-parent="' + esc(parent) + '" aria-label="Zurück">' + BACK_SVG + '</button>' : '') +
      '<span class="crumb">' + esc(crumb || '') + '</span><span class="spacer"></span>' + (extra || '') + '</header>';
  }
  function beatsLine(dance) {
    var rest = dance === 'bachata' ? 'tap' : '·';
    return [1, 2, 3, rest, 5, 6, 7, rest].map(function (b) { return '<span>' + b + '</span>'; }).join('');
  }
  function rulerRow(dance, live) {
    return '<div class="row">' + [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) {
      var attr = live ? ' data-beat="' + n + '"' : '';
      return (n === 4 || n === 8) ? '<span class="beat rest"' + attr + '>' + (dance === 'bachata' ? 'tap' : '·') + '</span>'
        : '<span class="beat"' + attr + '>' + n + '</span>';
    }).join('') + '</div>';
  }
  function norm(s) {
    return String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
  }
  function stepRow(s, withMeta) {
    var nd = draftsFor(s.id).length;
    var st = nd ? '<span class="st draft">Draft</span>'
      : s.status === 'platzhalter' ? '<span class="st">Beschreibung fehlt</span>'
      : s.status === 'pruefen' ? '<span class="st draft">Bitte prüfen</span>' : '';
    var meta = withMeta ? '<small>' + esc(danceName(s.dance)) + ', ' + s.level + (s.position ? ', ' + esc(s.position) : '') + '</small>' : '';
    return '<li><a href="#/step/' + s.id + '"><span class="nr">' + s.id + '</span><span class="nm">' + esc(s.name) + meta + '</span>' +
      (favs.has(s.id) ? '<span class="fav" aria-label="Favorit">★</span>' : '') + st + '</a></li>';
  }

  // ---------- Ansichten ----------
  function viewHome() {
    var tiles = Object.keys(DATA.dances).map(function (d) {
      var n = stepsOf(d).length;
      var lv = LEVELS.filter(function (l) { return stepsOf(d, l).length; });
      var meta = n ? n + ' Figuren' + (lv.length ? ', ' + lv[0] + (lv.length > 1 ? '–' + lv[lv.length - 1] : '') : '') : 'Noch keine Figuren';
      return '<a class="dance-tile" data-dance="' + d + '" href="#/' + d + '">' +
        '<span class="word">' + esc(danceName(d)) + '</span><span class="meta">' + meta + '</span>' +
        '<span class="beats" aria-hidden="true">' + beatsLine(d) + '</span></a>';
    }).join('');
    return '<div class="home-head"><h1>Tanzschritte</h1><a class="iconbtn" href="#/info" aria-label="Info und Abkürzungen">Info</a></div>' +
      '<input class="search" id="search" type="search" placeholder="Figur suchen …" autocomplete="off" value="' + esc(searchQ) + '">' +
      '<div id="results"></div>' +
      '<div id="homeMain">' + tiles +
        '<div class="quick"><a href="#/dice"><b>Würfeln</b><span>Zufalls-Kombi</span></a>' +
        '<a href="#/takt"><b>Übungstakt</b><span>' + (beat.playing ? 'läuft gerade' : 'Salsa &amp; Bachata') + '</span></a></div>' +
        (installEvt ? '<div class="stack"><button class="btn primary" data-action="install">App installieren</button></div>' : '') +
        '<a class="row-link" href="#/favs"><span>★ Favoriten</span><span class="count-pill">' + favs.size + '</span></a>' +
        '<a class="row-link" href="#/drafts"><span>Drafts</span><span class="count-pill">' + drafts.length + '</span></a>' +
      '</div>';
  }
  function searchResults(q) {
    var t = norm(q.trim());
    if (!t) return '';
    var hits = DATA.steps.filter(function (s) {
      return norm([s.id, s.name, s.notizen, s.alternativ, (s.ablauf || []).join(' '), notes[s.id]].join(' ')).indexOf(t) >= 0;
    });
    return hits.length ? '<ul class="list">' + hits.map(function (s) { return stepRow(s, true); }).join('') + '</ul>'
      : '<p class="empty-state">Keine Figur gefunden.</p>';
  }
  function setupSearch() {
    var inp = document.getElementById('search'); if (!inp) return;
    var res = document.getElementById('results'), main = document.getElementById('homeMain');
    function upd() { searchQ = inp.value; res.innerHTML = searchResults(searchQ); main.hidden = !!searchQ.trim(); }
    inp.addEventListener('input', upd); upd();
  }

  function viewDance(d) {
    if (!DATA.dances[d]) return viewNotFound();
    var tiles = LEVELS.map(function (l) {
      var n = stepsOf(d, l).length;
      return '<a class="level-tile lv-' + l + (n ? '' : ' empty') + '" href="#/' + d + '/' + l + '">' +
        '<b>' + l + '</b><span>' + (n ? n + (n === 1 ? ' Figur' : ' Figuren') : 'leer') + '</span></a>';
    }).join('');
    return '<div data-dance="' + d + '">' + bar('#/', 'Start') +
      '<h1 class="page-title">' + esc(danceName(d)) + '</h1><div class="levels">' + tiles + '</div></div>';
  }

  function viewLevel(d, l) {
    if (!DATA.dances[d] || LEVELS.indexOf(l) < 0) return viewNotFound();
    var steps = stepsOf(d, l);
    var list = steps.length ? '<ul class="list">' + steps.map(function (s) { return stepRow(s, false); }).join('') + '</ul>'
      : '<p class="empty-state">In ' + l + ' gibt es noch keine Figuren. Leg einen Draft an, um die erste zu beschreiben.</p>' +
        '<a class="btn" href="#/draft/new?dance=' + d + '&level=' + l + '">Draft anlegen</a>';
    return '<div data-dance="' + d + '">' + bar('#/' + d, danceName(d)) +
      '<h1 class="page-title"><span class="lv-' + l + '" style="color:var(--lv)">' + l + '</span></h1>' + list + '</div>';
  }

  function viewFavs() {
    var list = DATA.steps.filter(function (s) { return favs.has(s.id); });
    return bar('#/', 'Start') + '<h1 class="page-title">★ Favoriten</h1>' +
      (list.length ? '<ul class="list">' + list.map(function (s) { return stepRow(s, true); }).join('') + '</ul>'
        : '<p class="empty-state">Noch keine Favoriten. Tippe in einer Figur oben rechts auf ☆.</p>');
  }

  function defaultRows(dance) { return dance === 'bachata' ? ['1–2–3–tap', '5–6–7–tap'] : ['1–2–3', '5–6–7']; }

  function viewStep(id) {
    var s = stepById(id);
    if (!s) return viewNotFound();
    var dash = '<span class="dash">–</span>';
    var rows = (s.table && s.table.length) ? s.table : defaultRows(s.dance).map(function (c) { return { count: c, h: '', d: '' }; });
    var bars = s.counts ? Math.min(4, Math.max(1, Math.ceil(s.counts / 8))) : 1;
    var ruler = '<div class="ruler' + (s.counts ? '' : ' unknown') + '" aria-label="Zählweise">';
    for (var b = 0; b < bars; b++) ruler += rulerRow(s.dance, false);
    ruler += '</div>';
    var ablauf = (s.ablauf && s.ablauf.length) ? s.ablauf : [''];
    var siblings = stepsOf(s.dance, s.level);
    var i = siblings.indexOf(s), prev = siblings[i - 1], next = siblings[i + 1];
    var nd = draftsFor(s.id).length;
    var star = '<button class="iconbtn star" data-action="fav" data-id="' + s.id + '" aria-pressed="' + favs.has(s.id) + '" aria-label="Favorit">' + (favs.has(s.id) ? '★' : '☆') + '</button>';

    return '<div data-dance="' + s.dance + '">' + bar('#/' + s.dance + '/' + s.level, danceName(s.dance) + ' / ' + s.level, star) +
      '<p class="num">Nr. ' + s.id + '</p><h1 class="title">' + esc(s.name) + '</h1>' +
      (s.status === 'pruefen' ? '<p class="hint">Von Claude vorausgefüllt (Salsa On1) – bitte mit dem Kurs abgleichen.</p>' : '') +
      '<div class="chips"><span class="badge lv-' + s.level + '">' + s.level + '</span>' +
        '<span class="chip' + (s.counts ? '' : ' open') + '">' + (s.counts ? s.counts + ' Counts' : 'Länge offen') + '</span>' +
        '<span class="chip' + (s.position ? '' : ' open') + '">' + (s.position ? esc(s.position) : 'Position offen') + '</span></div>' +
      ruler +
      '<section class="video-wrap"><video id="vid" controls playsinline preload="metadata"' + (loopOn ? ' loop' : '') + '></video>' +
        '<div class="vmissing" id="vmiss" hidden><div>Noch kein Video gespeichert. Erwarteter Dateiname: <code>' + esc(s.video.split('/').pop()) + '</code></div>' +
        '<div class="btns"><button class="btn" data-action="pick-one" data-id="' + s.id + '">Video für diesen Schritt importieren</button>' +
        '<button class="btn" data-action="pick-many">Alle Videos importieren</button></div></div>' +
        '<div class="seg">' + [0.5, 1, 2].map(function (r) {
          return '<button data-action="speed" data-rate="' + r + '" aria-pressed="' + (r === rate) + '">' + String(r).replace('.', ',') + '×</button>';
        }).join('') + '<button data-action="loop" aria-pressed="' + loopOn + '">Schleife</button></div>' +
        (importedIds.has(s.id) ? '<button class="linkbtn" data-action="pick-one" data-id="' + s.id + '">Video ersetzen</button>' : '') + '</section>' +
      '<section><h2>Ablauf</h2><ol class="steps">' + ablauf.map(function (a) { return '<li>' + (a ? esc(a) : dash) + '</li>'; }).join('') + '</ol></section>' +
      '<section><h2>Counts</h2><table><thead><tr><th>Count</th><th>Leader</th><th>Follower</th></tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td>' + esc(r.count) + '</td><td>' + (r.h ? esc(r.h) : dash) + '</td><td>' + (r.d ? esc(r.d) : dash) + '</td></tr>'; }).join('') +
      '</tbody></table></section>' +
      '<section class="note"><h2>Notizen</h2>' + (s.notizen ? '<p>' + esc(s.notizen) + '</p>' : '') +
        (s.alternativ ? '<p class="alt"><b>Alternativ:</b> ' + esc(s.alternativ) + '</p>' : '') +
        '<textarea class="mynote" id="mynote" data-id="' + s.id + '" placeholder="Eigene Notiz – wird auf diesem Gerät gespeichert">' + esc(notes[s.id] || '') + '</textarea></section>' +
      '<div class="stack"><a class="btn" href="#/draft/new?step=' + s.id + '">' + (nd ? 'Weiteren Draft anlegen (' + nd + ' offen)' : 'Draft zu diesem Schritt') + '</a></div>' +
      '<nav class="pager">' +
        (prev ? '<a href="#/step/' + prev.id + '"><small>Vorher</small>' + esc(prev.name) + '</a>' : '<span></span>') +
        (next ? '<a class="next" href="#/step/' + next.id + '"><small>Nächster</small>' + esc(next.name) + '</a>' : '<span></span>') +
      '</nav></div>';
  }

  // ---------- Würfel ----------
  function parsePos(p) {
    var a = String(p || '').split('→');
    return a.length === 2 ? [a[0].trim().toLowerCase(), a[1].trim().toLowerCase()] : [null, null];
  }
  function dicePool() {
    return DATA.steps.filter(function (s) {
      return s.dance === dice.dance && s.wuerfel !== false &&
        (!dice.levels.length || dice.levels.indexOf(s.level) >= 0) && (!dice.favOnly || favs.has(s.id));
    });
  }
  function rollDice() {
    var pool = dicePool(), out = [], used = new Set();
    if (!pool.length) return [];
    for (var i = 0; i < dice.n; i++) {
      var cands = pool.filter(function (s) { return !used.has(s.id); });
      if (!cands.length) cands = pool.slice();
      var prevEnd = out.length ? parsePos(out[out.length - 1].position)[1] : null;
      var fit = prevEnd ? cands.filter(function (s) { var st = parsePos(s.position)[0]; return !st || st === prevEnd; }) : cands;
      if (!fit.length) fit = cands;
      var pick = fit[Math.floor(Math.random() * fit.length)];
      out.push(pick); used.add(pick.id);
    }
    return out.map(function (s) { return s.id; });
  }
  function viewDice() {
    var d = dice.dance;
    var levelBtns = LEVELS.map(function (l) {
      var has = stepsOf(d, l).length;
      return '<button data-action="dice-level" data-level="' + l + '" aria-pressed="' + (dice.levels.indexOf(l) >= 0) + '"' + (has ? '' : ' disabled') + '>' + l + '</button>';
    }).join('');
    var last = dice.last.map(stepById).filter(Boolean).filter(function (s) { return s.dance === d; });
    var pool = dicePool().length;
    return '<div data-dance="' + d + '">' + bar('#/', 'Start') + '<h1 class="page-title">Würfeln</h1>' +
      '<div class="field"><span>Tanz</span><div class="seg" style="margin:0">' + Object.keys(DATA.dances).map(function (k) {
        return '<button data-action="dice-dance" data-dance="' + k + '" aria-pressed="' + (k === d) + '">' + esc(danceName(k)) + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><span>Anzahl Figuren</span><div class="stepper"><button data-action="dice-n" data-d="-1" aria-label="Weniger">−</button>' +
        '<output>' + dice.n + '</output><button data-action="dice-n" data-d="1" aria-label="Mehr">+</button></div></div>' +
      '<div class="field"><span>Level (keins gewählt = alle)</span><div class="togglechips">' + levelBtns + '</div></div>' +
      '<div class="field"><div class="togglechips"><button data-action="dice-fav" aria-pressed="' + dice.favOnly + '">★ Nur Favoriten</button></div></div>' +

  // ---------- Übungstakt (Web Audio, offline) ----------
  var beat = { playing: false, slot: 0, next: 0, timer: null, queue: [], cur: 0, raf: 0 };
  var AC = null, bus = null, noiseBuf = null, wakeLock = null;
  var TEMPO = { salsa: { min: 100, max: 220, presets: [['Langsam', 120], ['Mittel', 160], ['Social', 190]] },

  function makeIR(sec) {
    var len = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(2, len, AC.sampleRate);
    for (var c = 0; c < 2; c++) {

      bus = AC.createGain(); bus.connect(master); bus.connect(rev); rev.connect(wet); wet.connect(master);
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.6), AC.sampleRate);

  function out(node, pan) {

    else node.connect(bus);

  function env(g, t, v, a, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);

  // Ton: {type, f, f2, glide, t, v, a, d, ft, ff, fq, pan}
  function voice(o) {
    var s = AC.createOscillator(), g = AC.createGain(), n = s, a = o.a || 0.002;
    s.type = o.type || 'sine'; s.frequency.setValueAtTime(o.f, o.t);
    if (o.f2) s.frequency.exponentialRampToValueAtTime(o.f2, o.t + (o.glide || 0.03));
    if (o.ft) { var fl = AC.createBiquadFilter(); fl.type = o.ft; fl.frequency.value = o.ff; if (o.fq) fl.Q.value = o.fq; s.connect(fl); n = fl; }
    n.connect(g); env(g, o.t, o.v, a, o.d); out(g, o.pan);
    s.start(o.t); s.stop(o.t + a + o.d + 0.05);
  }
  // Rauschen: {t, v, a, d, ft, ff, fq, pan, am}
  function hiss(o) {
    var s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(), a = o.a || 0.002;
    s.buffer = noiseBuf; fl.type = o.ft; fl.frequency.value = o.ff; if (o.fq) fl.Q.value = o.fq;
    s.connect(fl); fl.connect(g); env(g, o.t, o.v, a, o.d);
    if (o.am) {             // Güiro-Riffel
      var lfo = AC.createOscillator(), depth = AC.createGain(), am = AC.createGain();
      lfo.type = 'sawtooth'; lfo.frequency.value = o.am; depth.gain.value = 0.5; am.gain.value = 0.5;
      lfo.connect(depth); depth.connect(am.gain); g.connect(am); out(am, o.pan);
      lfo.start(o.t); lfo.stop(o.t + a + o.d + 0.05);

  }
  function bassNote(t, f, d, v) {
    [[f, 1, 'triangle'], [f * 2, 0.25, 'sine']].forEach(function (p) {
      var s = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain(), vv = v * p[1];
      s.type = p[2]; s.frequency.value = p[0]; fl.type = 'lowpass'; fl.frequency.value = 900;
      s.connect(fl); fl.connect(g);

      g.gain.exponentialRampToValueAtTime(vv * 0.45, t + d * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

  function pluck(t, f, v, pan) {

    fl.frequency.setValueAtTime(3200, t); fl.frequency.exponentialRampToValueAtTime(600, t + 0.3);

  function pianoChord(t, fs, v) {
    fs.forEach(function (f) {
      voice({ type: 'triangle', f: f, t: t + Math.random() * 0.008, v: v, d: 0.42, ft: 'lowpass', ff: 2600, pan: -0.2 });
      voice({ type: 'sine', f: f * 2, t: t, v: v * 0.25, d: 0.22, pan: -0.2 });

  }
  var INST = {
    clave: function (t, v) {

    guiro: function (t, v, long) {

    },
    bell: function (t, v, hi) {
      var k = hi ? 1.18 : 1;
      voice({ type: 'square', f: 560 * k, t: t, v: v, d: 0.13, ft: 'bandpass', ff: 1250 * k, fq: 3, pan: -0.35 });
      voice({ type: 'square', f: 845 * k, t: t, v: v * 0.7, d: 0.09, ft: 'bandpass', ff: 1600 * k, fq: 3, pan: -0.35 });

    conga: function (t, v, kind) {

    bongo: function (t, v, hi) { voice({ f: hi ? 560 : 410, f2: hi ? 500 : 365, glide: 0.015, t: t, v: v, d: 0.11, pan: 0.3 }); },
    guira: function (t, v, d) { hiss({ t: t, v: v, d: d, ft: 'highpass', ff: 6000, pan: -0.3 }); },

  // Salsa: Montuno I–IV–V–IV (C F G F), Akkord je 2 Counts
  var CH = { C: [261.63, 329.63, 392.0, 523.25], F: [349.23, 440.0, 523.25, 698.46], G: [392.0, 493.88, 587.33, 783.99] };
  var SALSA_CH = ['C', 'C', 'C', 'C', 'F', 'F', 'F', 'F', 'G', 'G', 'G', 'G', 'F', 'F', 'F', 'F'];
  var TUMBAO = ['muff', 'muff', 'slap', 'muff', 'muff', 'muff', 'open', 'low'];

  // 16 Achtel pro 8 Counts; Slot 0 = Count 1
  function playSlot(i, t, spb) {
    var s8 = spb / 2;
    function h() { return t + (Math.random() - 0.5) * 0.012; }          // leichte Ungenauigkeit wie live
    function hv(v) { return v * (0.82 + Math.random() * 0.3); }
    if (beatCfg.style === 'salsa') {
      if ([2, 4, 8, 11, 14].indexOf(i) >= 0) INST.clave(h(), hv(0.32));                 // Son-Clave 2-3
      INST.guiro(h(), hv(i % 2 === 0 ? 0.16 : 0.09), i % 2 === 0);                        // Güiro
      if (i % 2 === 0) INST.bell(h(), hv(i % 4 === 0 ? 0.05 : 0.035), i % 4 === 0);        // Campana leise
      var k = TUMBAO[i % 8];                                                              // Conga-Tumbao
      INST.conga(h(), hv(k === 'muff' ? 0.12 : k === 'slap' ? 0.38 : 0.45), k);
      var bassS = { 3: 87.31, 6: 98.0, 11: 87.31, 14: 65.41 };                            // Tumbao-Bass (vorgezogen)
      if (bassS[i]) bassNote(h(), bassS[i], s8 * (i % 8 === 3 ? 3 : 5), hv(0.5));
      if ([0, 2, 3, 5, 7].indexOf(i % 8) >= 0) {                                          // Piano-Montuno

      INST.bongo(h(), hv((i === 6 || i === 14) ? 0.5 : 0.22), i % 2 === 0);              // Martillo, Akzent auf 4 / 8

    window.scrollTo(0, same ? y : 0);
    render.last = location.hash;
    if (!p.length) setupSearch();
    if (p[0] === 'step') { setupVideo(stepById(p[1])); setupNote(); }
    if (p[0] === 'draft') setupForm();
    if (p[0] === 'takt') setupTakt();
    renderPill();
  }
  function onHash() {
    var h = location.hash || '#/';
    if (stack.length > 1 && stack[stack.length - 2] === h) stack.pop();
    else if (stack[stack.length - 1] !== h) stack.push(h);
    render();
  }

  // ---------- Video & Notizen ----------
  function setupVideo(s) {
    var v = document.getElementById('vid'); if (!v || !s) return;
    var miss = document.getElementById('vmiss');
    v.addEventListener('error', function () { v.hidden = true; miss.hidden = false; });
    v.addEventListener('loadedmetadata', function () { v.playbackRate = rate; });
    v.defaultPlaybackRate = rate;
    if (urlCache.has(s.id)) { v.src = urlCache.get(s.id); return; }
    videoGet(s.id).then(function (rec) {
      if (rec && rec.blob) { var u = URL.createObjectURL(rec.blob); urlCache.set(s.id, u); v.src = u; }
      else v.src = s.video;
    }, function () { v.src = s.video; });
  }
  function setupNote() {
    var ta = document.getElementById('mynote'); if (!ta) return;
    var t = null;
    ta.addEventListener('input', function () {
      clearTimeout(t);
      t = setTimeout(function () {
        var v = ta.value.trim();
        if (v) notes[ta.dataset.id] = ta.value; else delete notes[ta.dataset.id];
        lsSet(KEY.notes, notes);
      }, 400);
    });
  }
  function pickFiles(multiple, cb) {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = 'video/*'; i.multiple = !!multiple; i.style.display = 'none';
    document.body.appendChild(i);
    i.addEventListener('change', function () { cb(Array.prototype.slice.call(i.files || [])); i.remove(); });
    i.click();
  }

  // ---------- Export ----------
  function noteIds() { return Object.keys(notes).filter(function (id) { return String(notes[id] || '').trim(); }); }
  function exportCount() { return drafts.length + noteIds().length; }
  function draftsAsText() {
    var parts = ['### EXPORT Tanzschritte (Datenstand ' + DATA.version + ')'];
    if (drafts.length) parts.push('## DRAFTS\n\n' + drafts.map(function (d) {
      var s = d.step ? stepById(d.step) : null;
      return '[' + d.id + '] ' + danceName(d.dance) + ' | ' + (s ? s.id + ' ' + s.name : 'NEU: ' + (d.name || '?')) +
        ' | Level: ' + (d.level || 'offen') + '\n' + d.text;
    }).join('\n\n---\n\n'));
    var ids = noteIds();
    if (ids.length) parts.push('## NOTIZEN\n\n' + ids.map(function (id) {
      var s = stepById(id); return '[' + id + ' ' + (s ? s.name : '?') + ']\n' + notes[id].trim();
    }).join('\n\n'));
    return parts.join('\n\n');
  }
  function exportHtml() {
    var json = JSON.stringify(drafts, null, 1).replace(/</g, '\\u003c');
    var nj = {}; noteIds().forEach(function (id) { nj[id] = notes[id].trim(); });
    var njson = JSON.stringify(nj, null, 1).replace(/</g, '\\u003c');
    var out = SOURCE.replace(/(<script id="drafts" type="application\/json">)[\s\S]*?(<\/script>)/, function (m, a, b) { return a + json + b; })
      .replace(/(<script id="notes" type="application\/json">)[\s\S]*?(<\/script>)/, function (m, a, b) { return a + njson + b; });
    var blob = new Blob([out], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'tanzschritte-export.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Export gespeichert (' + drafts.length + ' Drafts, ' + noteIds().length + ' Notizen)');
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); toast(ok ? 'Export kopiert' : 'Kopieren nicht möglich');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Export kopiert'); }, fallback);
    } else fallback();
  }

  // ---------- Formular ----------
  function setupForm() {
    var f = document.getElementById('draftForm'); if (!f) return;
    var fd = document.getElementById('fDance'), fs = document.getElementById('fStep'), nw = document.getElementById('fNameWrap');
    fd.addEventListener('change', function () { fs.innerHTML = stepOptions(fd.value, ''); nw.hidden = false; });
    fs.addEventListener('change', function () {
      nw.hidden = !!fs.value;
      var s = stepById(fs.value); if (s) f.level.value = s.level;
    });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = f.dataset.id;
      var old = drafts.find(function (x) { return x.id === id; });
      var entry = {
        id: id === 'new' ? 'd' + Date.now().toString(36) : id,
        dance: f.dance.value, step: f.step.value || null,
        name: f.step.value ? '' : f.name.value.trim(),
        level: f.level.value, text: f.text.value.trim(),
        created: old ? old.created : new Date().toISOString()
      };
      if (!entry.text) return;
      var idx = drafts.findIndex(function (x) { return x.id === entry.id; });
      if (idx >= 0) drafts[idx] = entry; else drafts.push(entry);
      saveDrafts();
      toast(storageOk ? 'Draft gespeichert' : 'Draft gespeichert – nur bis zum Schließen');
      location.hash = '#/drafts';
    });
  }

  // ---------- Aktionen ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]'); if (!el) return;
    var act = el.dataset.action;
    if (act === 'back') {
      if (stack.length > 1) history.back(); else location.replace(el.dataset.parent);
    } else if (act === 'fav') {
      var fid = el.dataset.id;
      if (favs.has(fid)) favs.delete(fid); else favs.add(fid);
      lsSet(KEY.favs, Array.from(favs));
      el.setAttribute('aria-pressed', String(favs.has(fid))); el.textContent = favs.has(fid) ? '★' : '☆';
    } else if (act === 'speed') {
      rate = parseFloat(el.dataset.rate);
      var v = document.getElementById('vid'); if (v) { v.playbackRate = rate; v.defaultPlaybackRate = rate; }
      document.querySelectorAll('[data-action="speed"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
    } else if (act === 'loop') {
      loopOn = !loopOn; el.setAttribute('aria-pressed', String(loopOn));
      var v2 = document.getElementById('vid'); if (v2) v2.loop = loopOn;
    } else if (act === 'pick-one') {
      var sid = el.dataset.id;
      pickFiles(false, function (files) {
        if (!files[0]) return;
        toast('Video wird gespeichert …');
        importFiles(files, sid).then(function () { toast('Video gespeichert'); render(); }, function () { toast('Speichern fehlgeschlagen'); });
      });
    } else if (act === 'pick-many') {
      pickFiles(true, function (files) {
        if (!files.length) return;
        toast(files.length + ' Videos werden gespeichert …');
        importFiles(files).then(function (n) {
          toast(n + ' von ' + files.length + ' Videos zugeordnet' + (n < files.length ? ' (Rest ohne Nummer)' : ''));
          render();
        }, function () { toast('Speichern fehlgeschlagen'); });
      });
    } else if (act === 'clear-videos') {
      if (!confirm('Alle gespeicherten Videos aus der App löschen? Die Dateien auf dem Gerät bleiben erhalten.')) return;
      videoClear().then(function () {
        Array.from(urlCache.keys()).forEach(forgetUrl); importedIds.clear(); toast('Videos gelöscht'); render();
      });
    } else if (act === 'dice-dance') {
      dice.dance = el.dataset.dance; dice.levels = []; dice.last = []; lsSet(KEY.dice, dice); render();
    } else if (act === 'dice-n') {
      dice.n = Math.min(8, Math.max(2, dice.n + (+el.dataset.d))); lsSet(KEY.dice, dice); render();
    } else if (act === 'dice-level') {
      var l = el.dataset.level, k = dice.levels.indexOf(l);
      if (k >= 0) dice.levels.splice(k, 1); else dice.levels.push(l);
      lsSet(KEY.dice, dice); render();
    } else if (act === 'dice-fav') {
      dice.favOnly = !dice.favOnly; lsSet(KEY.dice, dice); render();
    } else if (act === 'dice-roll') {
      dice.last = rollDice(); lsSet(KEY.dice, dice); render();
    } else if (act === 'beat-toggle') {
      if (beat.playing) beatStop(); else beatStart();
      render();
    } else if (act === 'beat-style') {
      beatCfg.style = el.dataset.style; saveBeat();
      if (beat.playing) { beatStop(); beatStart(); }
      render();
    } else if (act === 'bpm') {
      setBpm(beatCfg.bpm[beatCfg.style] + (+el.dataset.d));
    } else if (act === 'bpm-set') {
      setBpm(+el.dataset.v);
    } else if (act === 'beat-count') {
      beatCfg.count = !beatCfg.count; saveBeat(); render();
    } else if (act === 'install') {
      if (installEvt) { installEvt.prompt(); installEvt = null; render(); }
    } else if (act === 'export') {
      exportHtml();
    } else if (act === 'copy') {
      copyText(draftsAsText());
    } else if (act === 'delete-draft') {
      if (!confirm('Draft löschen?')) return;
      drafts = drafts.filter(function (x) { return x.id !== el.dataset.id; });
      saveDrafts(); toast('Draft gelöscht'); location.replace('#/drafts');
    }
  });

  window.addEventListener('hashchange', onHash);
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); installEvt = e;
    if (!location.hash || location.hash === '#/') render();
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  onHash();
  refreshKeys().then(render);
})();
</script>
</body>
</html>
